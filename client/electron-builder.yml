appId: net.mtraverso.partybot
productName: PartyBot
directories:
  output: release
files:
  - dist/**
  - package.json
# Ship a plain zip of the app folder rather than the `portable` target: the
# portable exe is an NSIS self-extracting stub, which Windows Defender
# routinely flags as a trojan when unsigned.
win:
  target:
    - target: zip
      arch: [x64]
artifactName: PartyBot-${version}-win.${ext}
