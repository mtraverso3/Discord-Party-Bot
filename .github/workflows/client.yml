name: Desktop client

# Builds the Windows app zip. Trigger it manually from the Actions tab,
# or push a tag like client-v1.0.0 to also publish a GitHub release with the
# executable attached.

on:
  workflow_dispatch:
  push:
    tags: ['client-v*']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build Windows zip
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: PartyBot-windows
          path: client/release/PartyBot-*-win.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/release/PartyBot-*-win.zip
