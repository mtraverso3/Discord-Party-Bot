name: Deploy

# Manual deploys — trigger from the Actions tab ("Run workflow").
# Optionally re-registers the Discord slash commands in the same run.
#
# Merged pull requests can trigger it too, via labels:
#   deploy-on-merge        — deploy (migrations + Worker) when the PR merges
#   re-register-on-merge   — re-register the slash commands when the PR merges
# Attach both to deploy and then re-register in one run, e.g. when a PR
# changes a command's options. re-register-on-merge alone only registers.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    — API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   — from the Workers overview page sidebar
# Required only when re-registering (the checkbox or re-register-on-merge):
#   DISCORD_APPLICATION_ID  — Discord dev portal → General Information
#   DISCORD_BOT_TOKEN       — Discord dev portal → Bot (reset to obtain)
#
# Worker runtime secrets (DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN,
# DISCORD_APPLICATION_ID, CF_ACCESS_TEAM, CF_ACCESS_AUD) live on the Worker
# itself and persist across deploys — they are not needed here.

on:
  workflow_dispatch:
    inputs:
      register:
        description: Re-register Discord slash commands (global)
        type: boolean
        default: false
      maintenance:
        description: Force maintenance mode for this deploy (it switches on by itself for breaking migrations)
        type: boolean
        default: false
  pull_request:
    types: [closed]

jobs:
  deploy:
    concurrency:
      group: deploy
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'deploy-on-merge') ||
        contains(github.event.pull_request.labels.*.name, 're-register-on-merge')))
    runs-on: ubuntu-latest
    env:
      # A manual run always deploys; a merge deploys only with its label.
      DEPLOY: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deploy-on-merge') }}
      REGISTER: ${{ inputs.register == true || contains(github.event.pull_request.labels.*.name, 're-register-on-merge') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix admin-ui ci

      - name: Typecheck and test before deploying
        if: env.DEPLOY == 'true'
        run: npm run typecheck && npm test

      - name: Build admin UI
        if: env.DEPLOY == 'true'
        run: npm --prefix admin-ui run build

      # Migrations run before the new Worker is live. If any pending one removes
      # or renames schema the live code uses (see docs/deploying.md), answer
      # "updating, try again" until the deploy is done instead of failing.
      - name: Check pending migrations
        id: pending
        if: env.DEPLOY == 'true'
        run: |
          pending=$(npx wrangler d1 migrations list partybot --remote | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' | sed 's#^#migrations/#' || true)
          if npx tsx scripts/check-migrations.ts --files $pending && [ "${{ inputs.maintenance == true }}" != true ]
          then echo "maintenance=false" >> "$GITHUB_OUTPUT"
          else echo "maintenance=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Expires by itself after 10 minutes, so a deploy that dies halfway
      # doesn't leave PartyBot paused.
      - name: Enter maintenance mode
        if: env.DEPLOY == 'true' && steps.pending.outputs.maintenance == 'true'
        run: |
          npx wrangler d1 execute partybot --remote --command "
            CREATE TABLE IF NOT EXISTS system_state (key TEXT PRIMARY KEY, value TEXT NOT NULL);
            INSERT INTO system_state (key, value)
              VALUES ('maintenance_until', CAST(strftime('%s', 'now') AS INTEGER) * 1000 + 600000)
              ON CONFLICT (key) DO UPDATE SET value = excluded.value"
          sleep 10  # every running Worker re-reads the flag within 5s
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        if: env.DEPLOY == 'true'
        run: npx wrangler d1 migrations apply partybot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        if: env.DEPLOY == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Leave maintenance mode
        if: env.DEPLOY == 'true' && steps.pending.outputs.maintenance == 'true'
        run: npx wrangler d1 execute partybot --remote --command "DELETE FROM system_state WHERE key = 'maintenance_until'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Re-register Discord slash commands
        if: env.REGISTER == 'true'
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
