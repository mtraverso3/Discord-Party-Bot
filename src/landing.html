<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PartyBot</title>
  <style>
    :root {
      --background: oklch(0.978 0.003 247.86);
      --foreground: oklch(0.208 0.027 261.69);
      --muted: oklch(0.55 0.02 261.69);
      --primary: oklch(0.511 0.204 273.2);
      --primary-foreground: oklch(0.985 0.002 247.84);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.171 0.014 264.36);
        --foreground: oklch(0.925 0.007 264.53);
        --muted: oklch(0.7 0.02 264.53);
        --primary: oklch(0.669 0.16 274.06);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.1rem;
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: 0 8px 24px -8px color-mix(in oklch, var(--primary) 60%, transparent);
    }
    .logo svg { width: 2.5rem; height: 2.5rem; }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }
    footer a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.15s;
    }
    footer a:hover { color: var(--foreground); }
    footer svg { width: 1.05rem; height: 1.05rem; }
  </style>
</head>
<body>
  <!-- PartyPopper glyph from lucide-react, matching the admin UI's BrandMark. -->
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5.8 11.3 2 22l10.7-3.79"/>
      <path d="M4 3h.01"/>
      <path d="M22 8h.01"/>

      <path d="M22 20h.01"/>
      <path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/>
      <path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/>
      <path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/>
      <path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/>
    </svg>
  </div>
  <h1>PartyBot</h1>
  <footer>
    <a href="https://github.com/mtraverso3/Discord-Party-Bot" target="_blank" rel="noopener noreferrer">

</body>
</html>
