name = "discord-party-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Disables both the default <name>.<subdomain>.workers.dev URL and per-version preview URLs.
workers_dev = false
preview_urls = false

# Built admin SPA (React + Vite, source in admin-ui/). run_worker_first keeps
# every request going through the Worker so the Cloudflare Access JWT check in
# src/admin/index.ts gates the UI; the Worker serves files via the binding.
[assets]
directory = "admin-ui/dist"
binding = "ASSETS"
run_worker_first = true

# All bot state lives in D1 (schema in migrations/). Apply with:
#   wrangler d1 migrations apply partybot --remote
[[d1_databases]]
binding = "DB"
database_name = "partybot"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create partybot` output
migrations_dir = "migrations"

# Legacy KV namespace — kept only so POST /admin/api/import-kv can copy the
# durable data (profiles, settings, templates, client tokens) into D1.
# Remove this binding once the import has been run.
[[kv_namespaces]]
binding = "PARTY_KV"
id = "32fff28077814cbcac824ebd05c0ce66"

# Replaces the old Durable Object inactivity alarm: sweeps idle parties,
# expired link codes/client tokens, and trims audit logs.
[triggers]
crons = ["*/15 * * * *"]

# The PartyState Durable Object is retired — state moved to D1.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyState"]

[[migrations]]
tag = "v2"
deleted_classes = ["PartyState"]

[observability.logs]
enabled = true
invocation_logs = true

# Secrets set via: wrangler secret put SECRET_NAME
# DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN, DISCORD_APPLICATION_ID
# Optional: RIOT_API_KEY — enables live-game champion lookups (Spectator API)
# for the desktop client. Without it, the client shows champions from the local
# champ-select session only.
